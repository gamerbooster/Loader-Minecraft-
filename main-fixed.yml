name: NEXLoader Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Android SDK 36
        uses: android-actions/setup-android@v4

      - name: Instalar SDK Android 36
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Elegir y extraer ZIP
        run: |
          set -euxo pipefail
          if [ -f NEXLoader-7.8.0-java-android-source.zip ]; then
            ZIP=NEXLoader-7.8.0-java-android-source.zip
          elif [ -f NEXLoader-7.8.0-source.zip ]; then
            ZIP=NEXLoader-7.8.0-source.zip
          else
            echo "No se encontró el ZIP" >&2
            exit 1
          fi
          rm -rf extracted
          unzip -q "$ZIP" -d extracted
          test -f extracted/NEXLoader-7.8.0/android/settings.gradle
          test -f extracted/NEXLoader-7.8.0/android/app/build.gradle

      - name: Preparar proyecto
        run: |
          set -euxo pipefail
          PROJECT="extracted/NEXLoader-7.8.0/android"
          touch "$PROJECT/gradle.properties"
          grep -qxF 'android.useAndroidX=true' "$PROJECT/gradle.properties" || echo 'android.useAndroidX=true' >> "$PROJECT/gradle.properties"
          grep -qxF 'android.enableJetifier=true' "$PROJECT/gradle.properties" || echo 'android.enableJetifier=true' >> "$PROJECT/gradle.properties"
          grep -qxF 'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' "$PROJECT/gradle.properties" || echo 'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' >> "$PROJECT/gradle.properties"
          echo "NEX_PYTHON_BIN=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          if ! grep -q "buildPython System.getenv('NEX_PYTHON_BIN')" "$PROJECT/app/build.gradle"; then
            sed -i "/version = '3.13'/a\        buildPython System.getenv('NEX_PYTHON_BIN')" "$PROJECT/app/build.gradle"
          fi
          sed -i -E 's/compileSdk[[:space:]]+[0-9]+/compileSdk 36/g' "$PROJECT/app/build.gradle"

      - name: Construir APK
        run: |
          set -o pipefail
          PROJECT="extracted/NEXLoader-7.8.0/android"
          gradle \
            -p "$PROJECT" \
            :app:assembleDebug \
            --no-daemon \
            --console=plain \
            --stacktrace \
            2>&1 | tee build.log

      - name: Comprobar APK
        run: |
          set -euxo pipefail
          APK="extracted/NEXLoader-7.8.0/android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK"
          test -f "$APK"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXLoader-7.8.0-debug
          path: extracted/NEXLoader-7.8.0/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Guardar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXLoader-7.8.0-build-log
          path: build.log
          if-no-files-found: ignore
