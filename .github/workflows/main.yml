name: NEXLoader Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Instalar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK Android 36
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Extraer NEXLoader
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f "NEXLoader-7.8.0-java-android-source.zip" ]; then
            ZIP="NEXLoader-7.8.0-java-android-source.zip"
          elif [ -f "NEXLoader-7.8.0-source.zip" ]; then
            ZIP="NEXLoader-7.8.0-source.zip"
          else
            echo "ERROR: no se encontró el ZIP de NEXLoader"
            ls -lah
            exit 1
          fi

          rm -rf extracted
          unzip -q "$ZIP" -d extracted

          PROJECT="$(find extracted -type f -path '*/android/settings.gradle' -print -quit | sed 's#/settings.gradle$##')"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: el ZIP no contiene un proyecto Android Gradle válido"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/build.gradle"
          test -f "$PROJECT/app/build.gradle"

          echo "NEX_ANDROID_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "=== PROYECTO ANDROID DETECTADO ==="
          printf '%s\n' "$PROJECT"
          echo "=== ARCHIVOS GRADLE ==="
          find "$PROJECT" -maxdepth 3 -type f \( -name '*.gradle' -o -name '*.properties' \) -print | sort

      - name: Verificar configuración Android
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT="$NEX_ANDROID_DIR"

          touch "$PROJECT/gradle.properties"

          grep -qxF 'android.useAndroidX=true' "$PROJECT/gradle.properties" || \
            echo 'android.useAndroidX=true' >> "$PROJECT/gradle.properties"

          grep -qxF 'android.enableJetifier=true' "$PROJECT/gradle.properties" || \
            echo 'android.enableJetifier=true' >> "$PROJECT/gradle.properties"

          grep -qxF 'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' "$PROJECT/gradle.properties" || \
            echo 'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' >> "$PROJECT/gradle.properties"

          echo "=== APP BUILD.GRADLE ==="
          cat "$PROJECT/app/build.gradle"

          echo "=== GRADLE.PROPERTIES ==="
          cat "$PROJECT/gradle.properties"

          grep -Eq 'compileSdk[[:space:]]+36' "$PROJECT/app/build.gradle"
          grep -Eq 'minSdk[[:space:]]+26' "$PROJECT/app/build.gradle"
          grep -Eq "version[[:space:]]*=[[:space:]]*'3\.13'" "$PROJECT/app/build.gradle"
          grep -Eq 'buildPython[[:space:]]+System\.getenv\('\''NEX_PYTHON_BIN'\''\)' "$PROJECT/app/build.gradle"

          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')"
          PYTHON_VERSION="$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"

          test "$PYTHON_VERSION" = "3.13"
          echo "NEX_PYTHON_BIN=$PYTHON_BIN" >> "$GITHUB_ENV"

          echo "=== PYTHON ==="
          "$PYTHON_BIN" --version

      - name: Verificar proyecto Gradle
        shell: bash
        run: |
          set -euxo pipefail

          cd "$NEX_ANDROID_DIR"

          echo "=== PWD ==="
          pwd

          echo "=== ROOT GRADLE ==="
          ls -lah

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

          echo "=== GRADLE VERSION ==="
          gradle --version

      - name: Construir APK
        shell: bash
        run: |
          set -o pipefail

          cd "$NEX_ANDROID_DIR"

          echo "=== GRADLE BUILD ==="
          pwd

          gradle :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Comprobar APK
        shell: bash
        run: |
          set -euxo pipefail

          APK="$NEX_ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          ls -lh "$APK"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXLoader-7.8.0-debug
          path: ${{ env.NEX_ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Subir log de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXLoader-7.8.0-build-log
          path: build.log
          if-no-files-found: ignore
          
