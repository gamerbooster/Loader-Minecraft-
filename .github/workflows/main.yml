name: NEXLoader 7.8.4 Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nexloader-android-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_VERSION: '7.8.4'
  NEX_SOURCE_ZIP: 'NEXLoader-7.8.4-FULL-AUDIT-FIXED.zip'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar fuente NEXLoader
        shell: bash
        run: |
          set -euxo pipefail
          test -f "$NEX_SOURCE_ZIP"
          unzip -tq "$NEX_SOURCE_ZIP"
          rm -rf extracted
          unzip -q "$NEX_SOURCE_ZIP" -d extracted
          PROJECT="extracted/NEXLoader-$EXPECTED_VERSION"
          test -d "$PROJECT"
          test -f "$PROJECT/VERSION"
          test -f "$PROJECT/android/settings.gradle"
          test -f "$PROJECT/android/build.gradle"
          test -f "$PROJECT/android/app/build.gradle"
          ACTUAL_VERSION="$(tr -d '[:space:]' < "$PROJECT/VERSION")"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
          echo "NEX_VERSION=$ACTUAL_VERSION" >> "$GITHUB_ENV"
          echo "NEX_PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "NEX_ANDROID_DIR=$PROJECT/android" >> "$GITHUB_ENV"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Ejecutar tests del core
        working-directory: ${{ env.NEX_PROJECT_DIR }}
        run: |
          set -euxo pipefail
          python core/tests/test_all.py
          python -m compileall -q core tools

      - name: Verificar versión Android
        working-directory: ${{ env.NEX_PROJECT_DIR }}
        run: |
          set -euxo pipefail
          grep -Eq 'versionName[[:space:]]+nexVersion' android/app/build.gradle
          grep -Eq 'versionCode[[:space:]]+nexVersionCode' android/app/build.gradle

      - name: Sincronizar core Android
        working-directory: ${{ env.NEX_PROJECT_DIR }}
        run: |
          set -euxo pipefail
          python tools/sync_android_core.py
          python tools/check_versions.py

      - name: Auditar manifest Bedrock generado
        working-directory: ${{ env.NEX_PROJECT_DIR }}
        run: |
          set -euxo pipefail
          rm -rf /tmp/nex_ci_manifest_audit
          python core/nex_convert.py examples/capdemo.jar /tmp/nex_ci_manifest_audit
          python - <<'PY'
          from pathlib import Path
          import io, json, zipfile
          root = Path('/tmp/nex_ci_manifest_audit')
          addons = sorted(root.glob('*.mcaddon'))
          assert addons, f'No .mcaddon generated in {root}'
          with zipfile.ZipFile(addons[0]) as outer:
              expected = {'capdemo.behavior.mcpack', 'capdemo.resource.mcpack'}
              assert set(outer.namelist()) == expected, outer.namelist()
              for member in sorted(outer.namelist()):
                  with zipfile.ZipFile(io.BytesIO(outer.read(member))) as inner:
                      manifest = json.loads(inner.read('manifest.json').decode('utf-8'))
                      assert 'metadata' not in manifest, (member, manifest.get('metadata'))
                      assert 'Generated by NEX Loader 7.8.4' in manifest['header']['description']
          print('FINAL BEDROCK MANIFEST AUDIT: PASS')
          PY

      - name: Construir APK Debug
        working-directory: ${{ env.NEX_ANDROID_DIR }}
        env:
          NEX_PYTHON_BIN: ${{ env.pythonLocation }}/bin/python
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verificar APK real
        id: version
        working-directory: ${{ env.NEX_PROJECT_DIR }}
        run: |
          set -euxo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -f "$APK"
          ACTUAL="$("$AAPT" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)"
          CODE="$("$AAPT" dump badging "$APK" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n1)"
          test "$ACTUAL" = "$EXPECTED_VERSION"
          test -n "$CODE"
          OUT="android/app/build/outputs/apk/debug/NEXLoader-$EXPECTED_VERSION-debug.apk"
          mv "$APK" "$OUT"
          echo "version=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXLoader-${{ steps.version.outputs.version }}-debug
          path: ${{ env.NEX_PROJECT_DIR }}/android/app/build/outputs/apk/debug/NEXLoader-${{ steps.version.outputs.version }}-debug.apk
          if-no-files-found: error

      - name: Subir log de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXLoader-${{ env.EXPECTED_VERSION }}-build-log
          path: build.log
          if-no-files-found: ignore
          
