name: NEXLoader Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK Android 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Extraer NEXLoader
        run: |
          unzip -q NEXLoader-7.8.0-source.zip -d extracted

          echo "=== CONTENIDO ==="
          find extracted -maxdepth 2 -type d | sort

      - name: Preparar AndroidX y compileSdk
        run: |
          PROJECT="extracted/NEXLoader-7.8.0/android"

          mkdir -p "$PROJECT"

          touch "$PROJECT/gradle.properties"

          grep -qxF "android.useAndroidX=true" \
            "$PROJECT/gradle.properties" || \
            echo "android.useAndroidX=true" >> "$PROJECT/gradle.properties"

          grep -qxF "android.enableJetifier=true" \
            "$PROJECT/gradle.properties" || \
            echo "android.enableJetifier=true" >> "$PROJECT/gradle.properties"

          echo "=== GRADLE PROPERTIES ==="
          cat "$PROJECT/gradle.properties"

          echo "=== BUSCANDO COMPILE SDK ==="
          grep -Rni "compileSdk" "$PROJECT" || true

          echo "=== ACTUALIZANDO COMPILE SDK ==="
          find "$PROJECT" \
            -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -print0 | while IFS= read -r -d '' file; do
              sed -i -E \
                's/compileSdk[[:space:]]*[=:]?[[:space:]]*[0-9]+/compileSdk = 36/g' \
                "$file"
            done

      - name: Revisar proyecto
        run: |
          echo "=== JAVA ==="
          java -version

          echo "=== GRADLE ==="
          gradle --version

          echo "=== ANDROID ==="
          ls -lah extracted/NEXLoader-7.8.0/android

          echo "=== COMPILE SDK ==="
          grep -Rni "compileSdk" extracted/NEXLoader-7.8.0/android || true

      - name: Construir APK
        run: |
          gradle \
            -p extracted/NEXLoader-7.8.0/android \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Comprobar APK
        run: |
          echo "=== APK GENERADO ==="

          ls -lh \
            extracted/NEXLoader-7.8.0/android/app/build/outputs/apk/debug/

          test -f \
            extracted/NEXLoader-7.8.0/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXLoader-7.8.0-debug
          path: extracted/NEXLoader-7.8.0/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
