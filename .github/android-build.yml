name: NEXLoader Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Check project
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== ANDROID ==="
          ls -la android
          echo "=== JAVA ==="
          java -version
          echo "=== GRADLE ==="
          gradle --version
          echo "=== ANDROID SDK ==="
          sdkmanager --list_installed | head -100

      - name: Build Debug APK
        run: |
          gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Check APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXLoader-7.8.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
